<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポケカ コレクション管理</title>
<link rel="preconnect" href="https://assets.tcgdex.net" crossorigin>
<link rel="dns-prefetch" href="https://assets.tcgdex.net">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f172a; --panel: #1e293b; --panel2: #273449;
    --line: #334155; --text: #e2e8f0; --muted: #94a3b8;
    --accent: #38bdf8; --accent2: #0ea5e9; --gold: #fbbf24;
    --good: #34d399; --warn: #f59e0b;
  }
  body {
    font-family: 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', system-ui, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  /* Header */
  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(15,23,42,0.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 12px 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .brand { font-size: 16px; font-weight: 800; letter-spacing: .02em; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(#ef4444 0 50%, #fff 50% 100%); border: 2px solid #1a1a1a; position: relative; }
  .brand .dot::after { content:''; position:absolute; inset:0; margin:auto; width:6px; height:6px; background:#fff; border:2px solid #1a1a1a; border-radius:50%; }
  .grow { flex: 1; }
  .stat { font-size: 12px; color: var(--muted); }
  .stat b { color: var(--accent); font-size: 15px; }
  .btn {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    padding: 7px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; font-family: inherit;
    transition: background .12s, border-color .12s;
  }
  .btn:hover { background: #31435c; border-color: var(--accent); }
  .btn.primary { background: var(--accent2); border-color: var(--accent2); color: #012; font-weight: 700; }
  .btn.primary:hover { background: var(--accent); }
  .btn.ghost { background: transparent; }
  .btn:disabled { opacity: .4; cursor: default; }

  /* Layout */
  main { max-width: 1200px; margin: 0 auto; padding: 20px 18px 100px; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  .search {
    flex: 1; min-width: 180px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 14px; color: var(--text); font-size: 14px; font-family: inherit;
  }
  .search::placeholder { color: #64748b; }
  .search:focus { outline: none; border-color: var(--accent); }

  .crumb { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .crumb a { cursor: pointer; color: var(--accent); text-decoration: none; }
  .crumb a:hover { text-decoration: underline; }

  h1.view-title { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }

  /* Set grid */
  .set-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap: 14px; }
  .set-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; cursor: pointer; transition: transform .1s, border-color .12s;
    display: flex; flex-direction: column; gap: 10px;
  }
  .set-card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .set-logo { height: 46px; display: flex; align-items: center; }
  .set-logo img { max-height: 46px; max-width: 150px; object-fit: contain; }
  .set-logo .fallback { font-size: 11px; color: var(--muted); background: var(--panel2); padding: 4px 8px; border-radius: 6px; }
  .set-name { font-size: 14px; font-weight: 700; line-height: 1.4; }
  .set-id { font-size: 11px; color: var(--muted); }
  .prog { height: 8px; background: var(--panel2); border-radius: 6px; overflow: hidden; }
  .prog > i { display: block; height: 100%; background: linear-gradient(90deg,var(--accent2),var(--good)); border-radius: 6px; transition: width .3s; }
  .prog-txt { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .prog-txt b { color: var(--text); }

  /* Filters */
  .filter-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .filter-label { font-size: 11px; color: var(--muted); margin-right: 2px; }
  .chip { background: var(--panel); border: 1px solid var(--line); color: var(--muted); padding: 6px 13px; border-radius: 20px; font-size: 12px; cursor: pointer; user-select: none; }
  .chip.on { background: var(--accent2); color: #012; border-color: var(--accent2); font-weight: 700; }
  .chip.rar.on { background: var(--gold); border-color: var(--gold); color: #3a2a00; }
  .rar-note { font-size: 11.5px; color: var(--warn); margin: -6px 0 14px; display: none; }
  .rar-note.on { display: block; }

  /* Card grid */
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 12px; }
  .poke {
    position: relative; border-radius: 10px; overflow: hidden; cursor: pointer;
    background: var(--panel); border: 2px solid transparent; aspect-ratio: 63/88;
    transition: border-color .12s, transform .08s;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  }
  .poke .info-btn {
    position: absolute; bottom: 5px; right: 5px; z-index: 3;
    width: 30px; height: 30px; border-radius: 50%; border: none;
    background: rgba(15,23,42,.82); color: #fff; font-size: 15px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    line-height: 1;
  }
  .poke .info-btn:hover { background: var(--accent2); color: #012; }
  .poke .info-btn:active { transform: scale(.9); }
  .poke:hover { transform: scale(1.03); }
  .poke img { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter .15s, opacity .15s; }
  .poke.unowned img { filter: grayscale(1) brightness(.55); opacity: .8; }
  .poke.owned { border-color: var(--good); }
  .poke.pending { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
  .poke .num {
    position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,.7);
    font-size: 10px; padding: 1px 6px; border-radius: 5px; color: #fff; font-weight: 600;
  }
  .poke .check {
    position: absolute; top: 5px; right: 5px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--good); color: #052; display: none; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 900;
  }
  .poke.owned .check { display: flex; }
  .poke.pending .check { background: var(--gold); color: #3a2a00; display: flex; }
  .poke .flag { position: absolute; bottom: 26px; right: 5px; font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 5px; display: none; }
  .poke.pending .flag { display: block; background: var(--gold); color: #3a2a00; }
  .poke.pending.rm .flag { background: #ef4444; color: #fff; }
  .poke.pending.rm { border-color: #ef4444; box-shadow: 0 0 0 2px #ef4444 inset; }
  .poke.pending.rm .check { display: none; }
  .poke .nm {
    position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 6px 5px;
    background: linear-gradient(transparent, rgba(0,0,0,.85)); font-size: 10.5px; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .poke .noimg { width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:11px; text-align:center; padding:8px; }

  .loading, .empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 14px; }
  .spinner { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 14px; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Save bar */
  .savebar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: rgba(30,41,59,.97); backdrop-filter: blur(8px); border-top: 1px solid var(--gold);
    padding: 12px 18px; display: none; align-items: center; gap: 14px; flex-wrap: wrap;
    box-shadow: 0 -6px 20px rgba(0,0,0,.35);
  }
  .savebar.on { display: flex; }
  .savebar .info { font-size: 13px; }
  .savebar .info b { color: var(--gold); font-size: 15px; }
  .savebar .add { color: var(--good); }
  .savebar .rm { color: #f87171; }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal-bg.on { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; max-width: 380px; width: 100%; padding: 18px; text-align: center; }
  .modal img { max-width: 240px; width: 100%; border-radius: 10px; margin-bottom: 14px; }
  .modal h3 { font-size: 17px; margin-bottom: 6px; }
  .modal .meta { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .modal .meta span { color: var(--gold); }
  .imgreg { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); text-align: left; }
  .imgreg-title { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
  .imgreg-input { width: 100%; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--text); font-size: 12px; font-family: inherit; margin-bottom: 8px; }
  .imgreg-input:focus { outline: none; border-color: var(--accent); }
  .imgreg-btns { display: flex; gap: 6px; margin-bottom: 8px; }
  .imgreg-btns .btn { flex: 1; padding: 7px 6px; }
  .imgreg-hint { font-size: 10.5px; color: #64748b; line-height: 1.5; }
  .noimg small { font-size: 9px; opacity: .7; }
  .data-sec { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .data-title { font-size: 13px; font-weight: 700; margin-bottom: 10px; }
  .data-btns { display: flex; gap: 8px; margin-bottom: 8px; }
  .data-btns .btn { flex: 1; }
  .data-hint { font-size: 11.5px; color: var(--muted); line-height: 1.6; }
  /* Login screen */
  .login-screen { position: fixed; inset: 0; z-index: 80; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 20px; }
  .login-screen.on { display: flex; }
  .login-card { width: 100%; max-width: 360px; text-align: center; }
  .login-card .logo { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 20px; font-weight: 800; margin-bottom: 8px; }
  .login-card .logo .dot { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(#ef4444 0 50%, #fff 50% 100%); border: 2px solid #1a1a1a; position: relative; }
  .login-card .logo .dot::after { content:''; position:absolute; inset:0; margin:auto; width:8px; height:8px; background:#fff; border:2px solid #1a1a1a; border-radius:50%; }
  .login-card .lead { color: var(--muted); font-size: 12.5px; margin-bottom: 22px; line-height: 1.7; }
  .login-card input { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; color: var(--text); font-size: 15px; font-family: inherit; margin-bottom: 10px; }
  .login-card input:focus { outline: none; border-color: var(--accent); }
  .login-card .row { display: flex; gap: 10px; margin-top: 4px; }
  .login-card .row .btn { flex: 1; padding: 12px; font-size: 14px; }
  .login-card .skip { display: inline-block; margin-top: 22px; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; background: none; border: none; font-family: inherit; }
  .login-card .skip:hover { color: var(--text); }
  .toast { position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%); background: var(--good); color: #042; padding: 10px 20px; border-radius: 30px; font-weight: 700; font-size: 13px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 60; }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(-4px); }
</style>
</head>
<body>
<header>
  <div class="brand" onclick="goSets()"><span class="dot"></span>ポケカ コレクション</div>
  <div class="grow"></div>
  <div class="stat">所有 <b id="totalOwned">0</b> 枚</div>
  <div class="stat" id="syncStatus" style="color:var(--good);cursor:pointer" onclick="openData()" title="アカウント・データ管理"></div>
  <input type="file" id="importFileJson" accept="application/json,.json" style="display:none">
  <input type="file" id="importFileCsv" accept=".csv,text/csv" style="display:none">
  <button class="btn" onclick="openData()">データ管理</button>
</header>

<main>
  <div id="view"></div>
</main>

<!-- 保存バー（未保存の選択があるとき表示） -->
<div class="savebar" id="savebar">
  <div class="info" id="saveInfo"></div>
  <div class="grow"></div>
  <button class="btn ghost" onclick="cancelPending()">キャンセル</button>
  <button class="btn primary" onclick="savePending()">保存する</button>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBody"></div>
</div>

<!-- カード追加モーダル -->
<div class="modal-bg" id="addCardBg" onclick="if(event.target===this)closeAddCard()">
  <div class="modal" style="text-align:left;max-width:420px" id="addCardBody"></div>
</div>

<!-- データ管理モーダル -->
<div class="modal-bg" id="dataBg" onclick="if(event.target===this)closeData()">
  <div class="modal" style="text-align:left;max-width:420px">
    <h3 style="text-align:center;margin-bottom:4px">データ管理</h3>
    <p style="font-size:12px;color:var(--muted);text-align:center;margin-bottom:16px">定期的に書き出してバックアップしておくと安心です。</p>
    <div class="data-sec" id="cloudSec">
      <div class="data-title">☁ クラウド同期</div>
      <div id="cloudBody"></div>
    </div>
    <div class="data-sec">
      <div class="data-title">バックアップを書き出す</div>
      <div class="data-btns">
        <button class="btn primary" onclick="exportCSV()">CSVで書出</button>
        <button class="btn" onclick="exportJSON()">JSONで書出</button>
      </div>
      <div class="data-hint">CSVはExcel等で開けて中身を確認・手直しできます。壊れたときの復元向き。</div>
    </div>
    <div class="data-sec">
      <div class="data-title">バックアップを読み込む</div>
      <div class="data-btns">
        <button class="btn primary" onclick="document.getElementById('importFileCsv').click()">CSVを読込</button>
        <button class="btn" onclick="document.getElementById('importFileJson').click()">JSONを読込</button>
      </div>
      <div class="data-hint">読込時に「統合（追加）」か「上書き」を選べます。</div>
    </div>
    <div style="text-align:center;margin-top:6px"><button class="btn ghost" onclick="closeData()">閉じる</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- ログイン/新規登録画面（起動時・未ログイン時に表示。中身はJSで描画） -->
<div class="login-screen" id="loginScreen">
  <div class="login-card" id="loginCard"></div>
</div>

<script>
const API = 'https://api.tcgdex.net/v2/ja';
const STORE_KEY = 'pokecard_owned_v1';
// 日本語レア度コード → TCGdexのrarity文字列（実データで検証済み。メガ弾で有効、SV旧弾は未整備）
const RARITY_MAP = { AR:'Illustration rare', SR:'Ultra Rare', SAR:'Special illustration rare', MUR:'Mega Hyper Rare' };
const RARITY_CODES = Object.keys(RARITY_MAP);

// ===== クラウド保存（Supabase・ID/パスワード認証）。未設定（空）ならローカルのみで動作 =====
const SUPABASE_URL = 'https://utilhmilvmrptzrjljdt.supabase.co';
const SUPABASE_ANON = 'sb_publishable_1UA3-wEvmzBVIrp4DJqy0Q_TiC0Q451'; // publishable(anon相当)キー。RLSで本人の行のみアクセス可なので公開OK
const SESSION_KEY = 'pokecard_session';
let session = null; try { session = JSON.parse(localStorage.getItem(SESSION_KEY)) || null; } catch {}
let cloudTimer = null;
function cloudConfigured() { return !!(SUPABASE_URL && SUPABASE_ANON); }
function loggedIn() { return cloudConfigured() && session && !!session.access_token; }
function anonHeaders(extra) { return Object.assign({ apikey: SUPABASE_ANON, 'Content-Type': 'application/json' }, extra || {}); }
function authHeaders(extra) { return Object.assign({ apikey: SUPABASE_ANON, Authorization: 'Bearer ' + session.access_token }, extra || {}); }
function setCloudStatus(t) { const el = document.getElementById('syncStatus'); if (el) el.textContent = t || (loggedIn() ? '☁ ' + (session.email || 'ログイン中') : ''); }
function nowISO() { try { return new Date().toISOString(); } catch { return ''; } }
function persistSession() { try { localStorage.setItem(SESSION_KEY, JSON.stringify(session)); } catch {} }

// --- 認証 ---
async function authPost(path, body) {
  const r = await fetch(`${SUPABASE_URL}/auth/v1/${path}`, { method: 'POST', headers: anonHeaders(), body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error_description || d.msg || d.error || ('認証エラー ' + r.status));
  return d;
}
async function doSignup(email, pw) {
  const d = await authPost('signup', { email, password: pw });
  if (d.access_token) { session = { access_token: d.access_token, refresh_token: d.refresh_token, email }; persistSession(); return true; }
  // メール確認が有効な設定の場合はトークンが返らない
  return false;
}
async function doLogin(email, pw) {
  const d = await authPost('token?grant_type=password', { email, password: pw });
  session = { access_token: d.access_token, refresh_token: d.refresh_token, email }; persistSession();
}
async function refreshSession() {
  if (!session || !session.refresh_token) throw new Error('no session');
  const d = await authPost('token?grant_type=refresh_token', { refresh_token: session.refresh_token });
  session.access_token = d.access_token; session.refresh_token = d.refresh_token; persistSession();
}

// --- データ入出力（RLSで本人の行のみ。user_idはDB側でauth.uid()を既定値に） ---
async function cloudFetch(retry) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/collections?select=data,updated_at`, { headers: authHeaders() });
  if (r.status === 401 && !retry) { await refreshSession(); return cloudFetch(true); }
  if (!r.ok) throw new Error('取得 ' + r.status);
  const rows = await r.json();
  return rows[0] || null;
}
async function cloudPush(retry) {
  const payload = [{ data: { owned, images: customImg }, updated_at: nowISO() }];
  const r = await fetch(`${SUPABASE_URL}/rest/v1/collections?on_conflict=user_id`, {
    method: 'POST',
    headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' }),
    body: JSON.stringify(payload)
  });
  if (r.status === 401 && !retry) { await refreshSession(); return cloudPush(true); }
  if (!r.ok) throw new Error('保存 ' + r.status);
}
function scheduleCloudSave() {
  if (!loggedIn()) return;
  clearTimeout(cloudTimer);
  setCloudStatus('保存中…');
  cloudTimer = setTimeout(async () => {
    try { await cloudPush(); setCloudStatus('☁ 同期済み'); }
    catch { setCloudStatus('⚠ 同期失敗（オフライン？）'); }
  }, 800);
}

// ---- owned state（保存済み） ----
let owned = loadOwned();
function loadOwned() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch { return {}; }
}
function saveOwnedLocal() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(owned)); }
  catch (e) { alert('保存に失敗しました（ブラウザの保存容量が上限の可能性）。\nデータ管理から書き出してバックアップしてください。'); }
  refreshTotal();
}
function saveOwned() { saveOwnedLocal(); scheduleCloudSave(); }
function isOwned(id) { return !!owned[id]; }
function ownedCountForSet(setId) { const p = setId + '-'; let n = 0; for (const k in owned) if (k.startsWith(p)) n++; return n; }
function refreshTotal() { document.getElementById('totalOwned').textContent = Object.keys(owned).length; }

// ---- 手動登録画像（TCGdexに画像が無いカード用。cardId -> 画像URL or dataURL） ----
const IMG_KEY = 'pokecard_images_v1';
let customImg = loadImages();
function loadImages() { try { return JSON.parse(localStorage.getItem(IMG_KEY)) || {}; } catch { return {}; } }
function saveImagesLocal() {
  try { localStorage.setItem(IMG_KEY, JSON.stringify(customImg)); }
  catch (e) { alert('画像の保存に失敗しました（保存容量の上限の可能性）。\nファイル画像は容量が大きいため、URL登録の利用や不要画像の削除をおすすめします。'); }
}
function saveImages() { saveImagesLocal(); scheduleCloudSave(); }
// WebPはPNGの約1/11で軽い（iOS14+/主要ブラウザ対応）。読込高速化のため採用
// 共有画像マスタ（全ユーザー共通。card_idごとに1枚。Supabaseのcard_imagesテーブル）
const MASTER_KEY = 'pokecard_masterimg';
let masterImg = {}; try { masterImg = JSON.parse(localStorage.getItem(MASTER_KEY)) || {}; } catch {}
function saveMasterCache() { try { localStorage.setItem(MASTER_KEY, JSON.stringify(masterImg)); } catch {} }
// セット画像URLパターン（set_idごとに1つ。{n}=3桁番号。全カードに自動適用・共有マスタ）
const setImgPattern = {}; // setId -> "https://.../s/{n}.png"
function setIdOf(c) { const i = c.id.lastIndexOf('-'); return i > 0 ? c.id.slice(0, i) : ''; }
function genUrl(c) { const t = setImgPattern[setIdOf(c)]; return t ? t.replace('{n}', pad3(c.localId)) : null; }
// 表示優先: TCGdex画像 > 個別共有(card_images) > セットパターン > 個人ローカル
function cardThumb(c) { return c.image ? c.image + '/low.webp' : (masterImg[c.id] || genUrl(c) || customImg[c.id] || null); }
function cardFull(c)  { return c.image ? c.image + '/high.webp' : (masterImg[c.id] || genUrl(c) || customImg[c.id] || null); }
function anyCustomImg(id) { return masterImg[id] || customImg[id] || ''; }

async function fetchSetPatterns() {
  if (!cloudConfigured()) return;
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/set_images?select=set_id,url_template`, { headers: { apikey: SUPABASE_ANON } });
    if (!r.ok) return;
    (await r.json()).forEach(x => { setImgPattern[x.set_id] = x.url_template; });
    if (window._redrawSet) window._redrawSet();
  } catch {}
}
function deriveTemplate(url) {
  const re = /(\d+)(\.[a-zA-Z0-9]+)(\?.*)?$/;
  if (!re.test(url)) return null;
  return url.replace(re, '{n}$2$3');
}
async function cloudPushSetPattern(setId, template, retry) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/set_images?on_conflict=set_id`, {
    method: 'POST',
    headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' }),
    body: JSON.stringify([{ set_id: setId, url_template: template, updated_at: nowISO() }])
  });
  if (r.status === 401 && !retry) { await refreshSession(); return cloudPushSetPattern(setId, template, true); }
  if (!r.ok) throw new Error('パターン保存 ' + r.status);
}
async function cloudDeleteSetPattern(setId, retry) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/set_images?set_id=eq.${encodeURIComponent(setId)}`, { method: 'DELETE', headers: authHeaders() });
  if (r.status === 401 && !retry) { await refreshSession(); return cloudDeleteSetPattern(setId, true); }
}
async function setPatternPrompt(setId) {
  if (!loggedIn()) { alert('画像の一括設定はログインが必要です。'); return; }
  const cur = setImgPattern[setId];
  const sample = prompt(
    'このセットのカード画像URLを1枚貼ってください。\n番号部分（例: 001）を自動で差し替え、セット全カードに一括適用します。\n\n例: https://www.pokemon-card.com/ex/m1/assets/images/card/s/001.png\n\n' + (cur ? '（設定を解除するには「clear」と入力）\n現在: ' + cur : ''),
    cur ? '' : ''
  );
  if (sample === null) return;
  const s = sample.trim();
  if (s.toLowerCase() === 'clear') {
    try { await cloudDeleteSetPattern(setId); } catch {}
    delete setImgPattern[setId];
    toast('画像パターンを解除しました');
    if (setDetailCache[setId]) renderSet(setDetailCache[setId]);
    return;
  }
  const t = deriveTemplate(s);
  if (!t || t.indexOf('{n}') < 0) { alert('番号を含む画像URLを貼ってください（例: .../001.png）。'); return; }
  try {
    await cloudPushSetPattern(setId, t);
    setImgPattern[setId] = t;
    toast('このセットの画像を一括設定しました（全員に共有）');
    if (setDetailCache[setId]) renderSet(setDetailCache[setId]);
  } catch (e) { alert('設定に失敗しました：' + e.message); }
}

async function fetchMasterImages() {

async function cloudPushImage(id, url, retry) {

async function cloudDeleteImage(id, retry) {

// ===== 手動カード登録（TCGdexに無いカードを共有マスタで補完。custom_cardsテーブル） =====
const customCardsBySet = {}; // setId -> [{id,localId,name,image:null,custom:true}]
function pad3(n) { const s = String(n).replace(/[^0-9]/g, ''); return s ? s.padStart(3, '0') : String(n); }
async function loadCustomCards(setId) {
  if (!cloudConfigured()) { customCardsBySet[setId] = customCardsBySet[setId] || []; return; }
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/custom_cards?set_id=eq.${encodeURIComponent(setId)}&select=card_id,local_id,name,image_url`, { headers: { apikey: SUPABASE_ANON } });
    if (!r.ok) { customCardsBySet[setId] = customCardsBySet[setId] || []; return; }
    const rows = await r.json();
    customCardsBySet[setId] = rows.map(x => {
      if (x.image_url) masterImg[x.card_id] = x.image_url;
      return { id: x.card_id, localId: x.local_id || '', name: x.name || '(無名)', image: null, custom: true };
    });
    saveMasterCache();
  } catch { customCardsBySet[setId] = customCardsBySet[setId] || []; }
}
async function cloudPushCards(rows, retry) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/custom_cards?on_conflict=card_id`, {
    method: 'POST',
    headers: authHeaders({ 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' }),
    body: JSON.stringify(rows)
  });
  if (r.status === 401 && !retry) { await refreshSession(); return cloudPushCards(rows, true); }
  if (!r.ok) throw new Error('カード登録 ' + r.status);
}
async function cloudDeleteCard(id, retry) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/custom_cards?card_id=eq.${encodeURIComponent(id)}`, { method: 'DELETE', headers: authHeaders() });
  if (r.status === 401 && !retry) { await refreshSession(); return cloudDeleteCard(id, true); }
}
async function removeCustomCard(id, setId) {
  if (!loggedIn()) { alert('カードの削除はログインが必要です。'); return; }
  try { await cloudDeleteCard(id); } catch (e) { alert('削除に失敗しました：' + e.message); return; }
  await loadCustomCards(setId);
  if (setDetailCache[setId]) renderSet(setDetailCache[setId]);
  toast('カードを削除しました');
}

// ---- pending（未保存の選択。保存済みと状態が異なるカードIDの集合） ----
let pending = new Set();
function displayOwned(id) { return pending.has(id) ? !owned[id] : !!owned[id]; }
function togglePending(id) { if (pending.has(id)) pending.delete(id); else pending.add(id); updateSaveBar(); }
function commitView() {
  // セット表示中はその場更新（スクロール維持）。それ以外は通常再描画
  if (location.hash && location.hash.length > 1 && window._refreshInPlace) window._refreshInPlace();
  else rerender();
}
function cancelPending() { pending.clear(); updateSaveBar(); commitView(); }
function savePending() {
  let add = 0, rm = 0;
  pending.forEach(id => { if (owned[id]) { delete owned[id]; rm++; } else { owned[id] = 1; add++; } });
  pending.clear();
  saveOwned();
  updateSaveBar();
  commitView();
  toast(`保存しました（+${add}${rm?` / -${rm}`:''}）`);
}
function updateSaveBar() {
  const bar = document.getElementById('savebar');
  if (!pending.size) { bar.classList.remove('on'); return; }
  let add = 0, rm = 0;
  pending.forEach(id => { if (owned[id]) rm++; else add++; });
  const parts = [];
  if (add) parts.push(`<span class="add">+${add} 追加</span>`);
  if (rm) parts.push(`<span class="rm">−${rm} 削除</span>`);
  document.getElementById('saveInfo').innerHTML = `未保存の変更 <b>${pending.size}</b> 件 ・ ${parts.join(' / ')}`;
  bar.classList.add('on');
}

// ---- data cache ----
let setsCache = null;
const setDetailCache = {};
const rarityIndex = {}; // { setId: { code: Set(ids) } }

async function getSets() {
  if (setsCache) return setsCache;
  const r = await fetch(API + '/sets');
  if (!r.ok) throw new Error('sets ' + r.status);
  setsCache = await r.json();
  return setsCache;
}
async function getSet(id) {
  if (setDetailCache[id]) return setDetailCache[id];
  const r = await fetch(API + '/sets/' + id);
  if (!r.ok) throw new Error('set ' + r.status);
  const d = await r.json();
  setDetailCache[id] = d;
  return d;
}
async function ensureRarity(setId) {
  if (rarityIndex[setId]) return rarityIndex[setId];
  const idx = {};
  await Promise.all(RARITY_CODES.map(async code => {
    try {
      const r = await fetch(`${API}/cards?set=${encodeURIComponent(setId)}&rarity=${encodeURIComponent(RARITY_MAP[code])}`);
      const arr = r.ok ? await r.json() : [];
      idx[code] = new Set(arr.map(c => c.id));
    } catch { idx[code] = new Set(); }
  }));
  rarityIndex[setId] = idx;
  return idx;
}

function loading(msg) { view.innerHTML = `<div class="loading"><div class="spinner"></div>${msg||'読み込み中...'}</div>`; }

function renderSets(list) {
  view.innerHTML = `
    <h1 class="view-title">セット一覧</h1>
    <div class="sub">カードのセット（拡張パック等）を選ぶと、図鑑ビューで所有を登録できます。</div>
    <div class="toolbar"><input class="search" id="setSearch" placeholder="セット名で絞り込み..."></div>
    <div class="set-grid" id="setGrid"></div>`;

    grid.innerHTML = arr.map(s => {

let renderedHash = null; // 現在表示中のhash（戻る/進む検知用）
let curOwnedFilter = 'all';
let curRarities = new Set();
async function goSet(id) {
  renderedHash = id;
  location.hash = id;
  pending.clear(); updateSaveBar();
  loading('カードを取得中...');
  try {
    const set = await getSet(id);
    await loadCustomCards(id); // 手動登録カードを取得して合体
    curOwnedFilter = 'all';
    curRarities = new Set();
    renderSet(set);
  } catch (e) {
    view.innerHTML = `<div class="empty">カードの取得に失敗しました。<br><small>${e.message}</small></div>`;
  }
}

function renderSet(set) {
  // TCGdexのカード + 手動登録カード（共有マスタ）を合体し番号順に
  const tcg = set.cards || [];
  const extra = customCardsBySet[set.id] || [];
  const exIds = new Set(tcg.map(c => c.id));
  const cards = tcg.concat(extra.filter(c => !exIds.has(c.id)))
    .sort((a, b) => String(a.localId).localeCompare(String(b.localId), undefined, { numeric: true }));
  window._cards = cards; // openCard等から参照
  window._curSet = set;
  view.innerHTML = `
    <div class="crumb"><a onclick="goSets()">セット一覧</a> ／ ${esc(set.name)}</div>
    <h1 class="view-title">${esc(set.name)} <span style="font-size:13px;color:var(--muted)">(${set.id})</span>
      <button class="btn" style="font-size:11px;padding:4px 10px;margin-left:6px" onclick="setPatternPrompt('${set.id}')">🖼 画像一括</button>
      <button class="btn" style="font-size:11px;padding:4px 10px" onclick="openAddCard('${set.id}')">＋ カード追加</button></h1>
    <div class="sub" id="setSub"></div>
    <div class="filter-row">
      <span class="filter-label">状態</span>
      <span class="chip owned-f" data-f="all">すべて</span>
      <span class="chip owned-f" data-f="owned">所有のみ</span>
      <span class="chip owned-f" data-f="unowned">未所有のみ</span>
    </div>
    <div class="filter-row">
      <span class="filter-label">レア度</span>
      <span class="chip rar" data-r="AR">AR</span>
      <span class="chip rar" data-r="SR">SR</span>
      <span class="chip rar" data-r="SAR">SAR</span>
      <span class="chip rar" data-r="MUR">MUR</span>
    </div>
    <div class="rar-note" id="rarNote">このセットは AR/SR/SAR/MUR のレアリティ情報が未整備です（TCGdexの日本語データの制約。主に旧SV弾）。</div>
    <div class="card-grid" id="cardGrid"></div>`;

  const grid = document.getElementById('cardGrid');
  const sub = document.getElementById('setSub');

  const drawOwnedChips = () => view.querySelectorAll('.chip.owned-f').forEach(c => c.classList.toggle('on', c.dataset.f === curOwnedFilter));
  const drawRarChips = () => view.querySelectorAll('.chip.rar').forEach(c => c.classList.toggle('on', curRarities.has(c.dataset.r)));

  view.querySelectorAll('.chip.owned-f').forEach(c => c.onclick = () => { curOwnedFilter = c.dataset.f; drawOwnedChips(); drawCards(); });
  view.querySelectorAll('.chip.rar').forEach(c => c.onclick = async () => {
    const code = c.dataset.r;
    if (curRarities.has(code)) curRarities.delete(code); else curRarities.add(code);
    drawRarChips();
    if (curRarities.size) { c.textContent = '…'; await ensureRarity(set.id); c.textContent = code; }
    drawCards();
  });
  drawOwnedChips(); drawRarChips();

  function drawCards() {
    // このセットはTCGdexにカード実データが無い（枚数だけ登録され中身が空）
    if (!cards.length) {
      document.getElementById('setSub').innerHTML = `カード ${(set.cardCount && set.cardCount.total) || 0} 枚（データ未整備）`;
      grid.innerHTML = `<div class="empty">このセットのカードデータが TCGdex にまだありません。<br><small>${esc(set.name)}（${set.id}）・データが追加されれば自動で表示されます</small></div>`;
      return;
    }
    // レア度フィルタ適用対象IDの算出
    let rarPass = null; // null = フィルタ無し
    if (curRarities.size && rarityIndex[set.id]) {
      rarPass = new Set();
      curRarities.forEach(code => (rarityIndex[set.id][code] || new Set()).forEach(id => rarPass.add(id)));
      // このセットに該当レア度データが全く無い場合は注意表示
      const anyData = RARITY_CODES.some(c => (rarityIndex[set.id][c] || new Set()).size > 0);
      document.getElementById('rarNote').classList.toggle('on', !anyData);
    } else {
      document.getElementById('rarNote').classList.remove('on');
    }

    const total = cards.length;
    const own = cards.filter(c => isOwned(c.id)).length;
    const pct = total ? Math.round(own/total*100) : 0;
    sub.innerHTML = `コンプ率 <b style="color:var(--accent)">${pct}%</b> ・ ${own} / ${total} 枚 <span style="color:#64748b">（カードをタップで選択 → 保存で登録）</span>`;

    let shown = cards;
    if (curOwnedFilter === 'owned') shown = shown.filter(c => displayOwned(c.id));
    else if (curOwnedFilter === 'unowned') shown = shown.filter(c => !displayOwned(c.id));
    if (rarPass) shown = shown.filter(c => rarPass.has(c.id));

    if (!shown.length) { grid.innerHTML = `<div class="empty">表示するカードがありません。</div>`; return; }

    grid.innerHTML = shown.map(c => {
      const dOwned = displayOwned(c.id);
      const isPend = pending.has(c.id);
      const isRm = isPend && owned[c.id]; // 保存済み所有を外そうとしている
      let cls = dOwned ? 'owned' : 'unowned';
      if (isPend) cls += isRm ? ' pending rm' : ' pending';
      const src = cardThumb(c);
      // 画像404時は img だけを差し替える（outerHTML）。parentNodeを消すとⓘボタン等まで消えるため
      const noimgHtml = `<div class=\\'noimg\\'><b style=\\'font-size:13px;color:#cbd5e1\\'>No.${c.localId}</b><br>${esc(c.name)}<br><small style=\\'color:#60a5fa\\'>ⓘで画像追加</small></div>`;
      const img = src
        ? `<img src="${src}" alt="${esc(c.name)}" loading="lazy" decoding="async" onerror="this.outerHTML='${noimgHtml}'">`
        : `<div class="noimg"><b style="font-size:13px;color:#cbd5e1">No.${c.localId}</b><br>${esc(c.name)}<br><small style="color:#60a5fa">ⓘで画像追加</small></div>`;
      return `<div class="poke ${cls}" data-id="${c.id}">
        ${img}
        <div class="num">${c.localId}</div>
        <div class="check">✓</div>
        <div class="flag">${isRm ? '削除予定' : '追加予定'}</div>
        <div class="nm">${esc(c.name)}</div>
        <button class="info-btn" data-info="${c.id}" title="詳細・画像登録">ⓘ</button>
      </div>`;
    }).join('');

    grid.querySelectorAll('.poke').forEach(el => {
      const id = el.dataset.id;
      // カード本体タップ＝選択トグル
      el.addEventListener('click', () => {
        togglePending(id);
        if (curOwnedFilter === 'all') updateCardEl(el, id);
        else drawCards();
      });
      // ⓘボタン＝詳細・画像登録を開く（選択トグルはしない）
      const info = el.querySelector('.info-btn');
      if (info) {
        const open = e => { e.stopPropagation(); e.preventDefault(); openCard(id); };
        info.addEventListener('click', open);
      }
      // PC右クリックでも詳細
      el.addEventListener('contextmenu', e => { e.preventDefault(); openCard(id); });
    });
  }

  function updateCardEl(el, id) {
    const dOwned = displayOwned(id);
    const isPend = pending.has(id);
    const isRm = isPend && owned[id];
    el.className = 'poke ' + (dOwned ? 'owned' : 'unowned') + (isPend ? (isRm ? ' pending rm' : ' pending') : '');
    const flag = el.querySelector('.flag'); if (flag) flag.textContent = isRm ? '削除予定' : '追加予定';
  }

  // 保存/キャンセル後：グリッドを作り直さず、その場で見た目とコンプ率だけ更新（スクロール位置維持）
  function refreshInPlace() {
    grid.querySelectorAll('.poke').forEach(el => updateCardEl(el, el.dataset.id));
    const total = cards.length;
    const own = cards.filter(c => isOwned(c.id)).length;
    const pct = total ? Math.round(own/total*100) : 0;
    sub.innerHTML = `コンプ率 <b style="color:var(--accent)">${pct}%</b> ・ ${own} / ${total} 枚 <span style="color:#64748b">（カードをタップで選択 → 保存で登録）</span>`;
  }

  window._redrawSet = drawCards;       // モーダル等からの再描画用
  window._refreshInPlace = refreshInPlace; // 保存/キャンセル用
  drawCards();
}

// ---- card detail modal ----
async function openCard(id) {
  const mb = document.getElementById('modalBg'), body = document.getElementById('modalBody');
  mb.classList.add('on');
  body.innerHTML = `<div class="loading"><div class="spinner"></div>読み込み中...</div>`;
  try {
    const localCard = (window._cards || []).find(x => x.id === id);
    const isCustomCard = localCard && localCard.custom;
    let c;
    if (isCustomCard) {
      c = { name: localCard.name, localId: localCard.localId, rarity: '手動登録', image: null, set: { name: (window._curSet && window._curSet.name) || '' } };
    } else {
      const r = await fetch(API + '/cards/' + id);
      c = await r.json();
    }
    const willOwn = displayOwned(id);
    const full = cardFull(c);
    const existing = anyCustomImg(id);
    const hasCustom = !c.image && !!existing;
    const imgHtml = full
      ? `<img src="${full}" alt="" onerror="this.style.display='none'">`
      : `<div class="noimg" style="height:180px;border-radius:10px;margin-bottom:14px">画像なし</div>`;
    // TCGdexに画像が無いカードだけ、手動登録UIを出す
    const regHtml = c.image ? '' : `
      <div class="imgreg">
        <div class="imgreg-title">画像を登録（全員で共有）${hasCustom?'・登録済み':''}</div>
        <input id="imgUrl" class="imgreg-input" placeholder="画像URLを貼り付け（公式サイトの画像URL等）" value="${hasCustom&&/^https?:/.test(existing)?esc(existing):''}">
        <div class="imgreg-btns">
          <button class="btn primary" id="imgSave">URLを登録</button>
          <button class="btn" id="imgFileBtn">ファイルから</button>
          ${hasCustom?'<button class="btn" id="imgDel">削除</button>':''}
        </div>
        <input type="file" id="imgFile" accept="image/*" style="display:none">
        <div class="imgreg-hint">${loggedIn()?'登録するとログイン利用者みんなに共有されます。':'ログインすると全員に共有できます（今はこの端末のみ保存）。'}公式カード画像のURL貼付けがおすすめ。</div>
      </div>`;
    body.innerHTML = `
      ${imgHtml}
      <h3>${esc(c.name)}</h3>
      <div class="meta">No.${c.localId} ・ レアリティ <span>${esc(c.rarity||'不明')}</span><br>${esc((c.set&&c.set.name)||'')}</div>
      <button class="btn primary" style="width:100%" id="mToggle">${willOwn?'✓ 選択中（タップで外す）':'選択に追加する'}</button>
      ${regHtml}
      ${isCustomCard ? `<button class="btn ghost" style="width:100%;margin-top:8px;color:#f87171" id="delCard">このカードを一覧から削除</button>` : ''}`;
    document.getElementById('mToggle').onclick = () => {
      togglePending(id);
      closeModal();
      if (window._redrawSet) window._redrawSet();
    };
    if (isCustomCard) {
      const dc = document.getElementById('delCard');
      if (dc) dc.onclick = async () => { const sid = window._curSet ? window._curSet.id : id.slice(0, id.lastIndexOf('-')); closeModal(); await removeCustomCard(id, sid); };
    }
    if (!c.image) {
      const refresh = () => { closeModal(); if (window._redrawSet) window._redrawSet(); };
      document.getElementById('imgSave').onclick = async () => {
        const u = document.getElementById('imgUrl').value.trim();
        if (!u) { alert('画像URLを入力してください。'); return; }
        try { await registerImage(id, u); refresh(); } catch (e) { alert('登録に失敗しました：' + e.message); }
      };
      document.getElementById('imgFileBtn').onclick = () => document.getElementById('imgFile').click();
      document.getElementById('imgFile').onchange = ev => {
        const f = ev.target.files[0]; if (!f) return;
        if (f.size > 1.5 * 1024 * 1024) { if (!confirm('画像が大きめです（共有データを圧迫する場合があります）。URL登録がおすすめです。続けますか？')) return; }
        const rd = new FileReader();
        rd.onload = async () => { try { await registerImage(id, rd.result); refresh(); } catch (e) { alert('登録に失敗しました：' + e.message); } };
        rd.readAsDataURL(f);
      };
      const del = document.getElementById('imgDel');
      if (del) del.onclick = async () => { await removeImage(id); refresh(); };
    }
  } catch (e) {
    body.innerHTML = `<div class="empty">詳細を取得できませんでした。</div>`;
  }
}
function closeModal() { document.getElementById('modalBg').classList.remove('on'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeAddCard(); } });

// ---- カード追加モーダル（TCGdexに無いカードを共有マスタで補完） ----
let curAddSet = null;
function openAddCard(setId) {
  if (!loggedIn()) { alert('カードの追加はログインが必要です（データ管理からログイン）。'); return; }
  curAddSet = setId;
  const total = (window._curSet && window._curSet.cardCount && window._curSet.cardCount.total) || 0;
  document.getElementById('addCardBody').innerHTML = `
    <h3 style="text-align:center;margin-bottom:4px">カードを追加</h3>
    <p style="font-size:12px;color:var(--muted);text-align:center;margin-bottom:14px">${esc(setId)} に手動でカードを追加します（全員に共有）。</p>
    <div class="data-sec">
      <div class="data-title">個別に追加</div>
      <input id="acNum" class="imgreg-input" placeholder="番号（例: 1 または 001）" style="margin-bottom:8px">
      <input id="acName" class="imgreg-input" placeholder="カード名" style="margin-bottom:8px">
      <input id="acImg" class="imgreg-input" placeholder="画像URL（任意）" style="margin-bottom:8px">
      <div class="data-btns"><button class="btn primary" id="acAdd">このカードを追加</button></div>
    </div>
    <div class="data-sec">
      <div class="data-title">一括で追加</div>
      <textarea id="acBulk" class="imgreg-input" style="height:88px;resize:vertical" placeholder="1行1枚：「番号,名前,画像URL(任意)」\n例）001,リザードンex,https://...\n002,ピカチュウ"></textarea>
      <div class="data-btns" style="margin-top:8px">
        <button class="btn primary" id="acBulkAdd">一括追加</button>
        ${total ? `<button class="btn" id="acGen">1〜${total}番を空生成</button>` : ''}
      </div>
      <div class="data-hint">「空生成」は番号だけのスロットを作ります（名前・画像は後で追加可）。</div>
    </div>
    <div style="text-align:center;margin-top:6px"><button class="btn ghost" onclick="closeAddCard()">閉じる</button></div>`;
  document.getElementById('addCardBg').classList.add('on');
  document.getElementById('acAdd').onclick = addOneCard;
  document.getElementById('acBulkAdd').onclick = addBulkCards;
  const gen = document.getElementById('acGen');
  if (gen) gen.onclick = genEmptyCards;
}
function closeAddCard() { document.getElementById('addCardBg').classList.remove('on'); }

function mkCardRow(setId, num, name, img) {
  const lid = pad3(num);
  return { card_id: `${setId}-${lid}`, set_id: setId, local_id: lid, name: (name || '').trim() || '(無名)', image_url: (img || '').trim() || null, updated_at: nowISO() };
}
async function commitCards(rows) {
  if (!rows.length) { alert('追加する内容がありません。'); return; }
  try {
    await cloudPushCards(rows);
    rows.forEach(r => { if (r.image_url) masterImg[r.card_id] = r.image_url; });
    saveMasterCache();
    await loadCustomCards(curAddSet);
    if (setDetailCache[curAddSet]) renderSet(setDetailCache[curAddSet]);
    closeAddCard();
    toast(`${rows.length}枚を追加しました（全員に共有）`);
  } catch (e) { alert('追加に失敗しました：' + e.message); }
}
function addOneCard() {
  const num = val('acNum').trim();
  if (!num) { alert('番号を入力してください。'); return; }
  commitCards([mkCardRow(curAddSet, num, val('acName'), val('acImg'))]);
}
function addBulkCards() {
  const lines = val('acBulk').split('\n').map(s => s.trim()).filter(Boolean);
  const rows = [];
  lines.forEach(line => {
    const parts = line.split(',');
    const num = (parts[0] || '').trim();
    if (!num) return;
    rows.push(mkCardRow(curAddSet, num, parts[1] || '', parts[2] || ''));
  });
  if (!rows.length) { alert('「番号,名前」の形式で入力してください。'); return; }
  commitCards(rows);
}
function genEmptyCards() {
  const total = (window._curSet && window._curSet.cardCount && window._curSet.cardCount.total) || 0;
  if (!total) return;
  const existing = new Set((customCardsBySet[curAddSet] || []).map(c => c.id).concat((window._cards || []).map(c => c.id)));
  const rows = [];
  for (let i = 1; i <= total; i++) {
    const id = `${curAddSet}-${pad3(i)}`;
    if (!existing.has(id)) rows.push(mkCardRow(curAddSet, i, '', ''));
  }
  if (!rows.length) { alert('生成する番号がありません（すでに揃っています）。'); return; }
  if (!confirm(`${rows.length}件の空スロットを作成します。よろしいですか？`)) return;
  commitCards(rows);
}

// ---- データ管理モーダル ----
function openData() { renderCloudSec(); document.getElementById('dataBg').classList.add('on'); }
function closeData() { document.getElementById('dataBg').classList.remove('on'); }

function renderCloudSec() {
  const body = document.getElementById('cloudBody');
  if (!cloudConfigured()) {
    body.innerHTML = `<div class="data-hint">クラウド設定が未完了です。設定が入るとID・パスワードでログインできます。</div>`;
    return;
  }
  if (loggedIn()) {
    body.innerHTML = `
      <div class="data-hint" style="margin-bottom:8px"><b style="color:var(--good)">${esc(session.email || 'ログイン中')}</b> でログイン中。<br>他の端末でも同じID・パスワードでログインすると同じデータになります。</div>
      <div class="data-btns"><button class="btn" id="cloudPullBtn">今すぐ取得</button><button class="btn ghost" id="cloudLogoutBtn">ログアウト</button></div>`;
    document.getElementById('cloudLogoutBtn').onclick = logout;
    document.getElementById('cloudPullBtn').onclick = () => cloudInitialSync(true);
  } else {
    body.innerHTML = `
      <div class="data-hint" style="margin-bottom:10px">ID・パスワードでログインすると、データがクラウドに保存され PC・スマホで共有されます。</div>
      <div class="data-btns"><button class="btn primary" id="toLoginScreen">ログイン / 新規登録</button></div>`;
    document.getElementById('toLoginScreen').onclick = () => { closeData(); showLoginScreen(); };
  }
}
function val(id) { const el = document.getElementById(id); return el ? el.value : ''; }

async function authFlow(isSignup, emailArg, pwArg) {
  const email = (emailArg || '').trim();
  const pw = pwArg || '';
  if (!email || !pw) { alert('IDとパスワードを入力してください。'); return; }
  if (pw.length < 6) { alert('パスワードは6文字以上にしてください。'); return; }
  setCloudStatus('接続中…');
  try {
    if (isSignup) {
      const ok = await doSignup(email, pw);
      if (!ok) { await doLogin(email, pw); } // 確認メール設定時などはログインで取得
    } else {
      await doLogin(email, pw);
    }
    // ログイン後：クラウドの本人データと突き合わせ
    const remote = await cloudFetch();
    const hasRemote = remote && remote.data && (Object.keys(remote.data.owned || {}).length || Object.keys(remote.data.images || {}).length);
    const hasLocal = Object.keys(owned).length || Object.keys(customImg).length;
    if (hasRemote) {
      let useRemote = true;
      if (hasLocal) useRemote = confirm('クラウドに保存済みのデータがあります。\n[OK]=クラウドのデータを読み込む\n[キャンセル]=この端末のデータでクラウドを上書き');
      if (useRemote) { owned = remote.data.owned || {}; customImg = remote.data.images || {}; saveOwnedLocal(); saveImagesLocal(); }
      else { await cloudPush(); }
    } else {
      await cloudPush(); // クラウド空 → 今の端末のデータをアップ
    }
    setCloudStatus('☁ 同期済み');
    try { localStorage.removeItem('pokecard_localonly'); } catch {}
    fetchMasterImages(); // 共有画像マスタを最新化
    hideLoginScreen();
    closeData(); toast(isSignup ? '登録してログインしました' : 'ログインしました'); rerender();
  } catch (e) {
    setCloudStatus('⚠ 失敗');
    alert((isSignup ? '登録' : 'ログイン') + 'に失敗しました。\n' + e.message);
  }
}
function logout() {
  session = null;
  try { localStorage.removeItem(SESSION_KEY); localStorage.removeItem('pokecard_localonly'); } catch {}
  setCloudStatus('');
  renderCloudSec();
  closeData();
  toast('ログアウトしました');
  if (cloudConfigured()) showLoginScreen();
}
async function cloudInitialSync(manual) {
  if (!loggedIn()) return;
  setCloudStatus('同期中…');
  try {
    const remote = await cloudFetch();
    if (remote && remote.data) {
      owned = remote.data.owned || {}; customImg = remote.data.images || {};
      saveOwnedLocal(); saveImagesLocal(); rerender();
    }
    setCloudStatus('☁ 同期済み');
    if (manual) { toast('クラウドから取得しました'); closeData(); }
  } catch (e) {
    setCloudStatus('⚠ オフライン（ローカル表示）');
    if (manual) alert('取得に失敗しました。\n' + e.message);
  }
}

function ts() { try { return new Date().toISOString().slice(0,10); } catch { return 'backup'; } }
function download(text, name, type) {
  const blob = new Blob([text], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

// --- JSON ---
function exportJSON() {
  const data = { version: 1, exportedAt: (function(){ try { return new Date().toISOString(); } catch { return ''; } })(), owned, images: customImg };
  download(JSON.stringify(data, null, 2), `pokecard_backup_${ts()}.json`, 'application/json');
  toast('JSONを書き出しました');
}

// --- CSV（card_id,set_id,number,owned。人間が読めて復元しやすい形式） ---
function csvCell(v) { v = String(v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function exportCSV() {
  const rows = [['card_id','set_id','number','owned','image_url']];
  // 所有カード＋画像だけ登録したカードの両方を網羅
  const ids = new Set([...Object.keys(owned), ...Object.keys(customImg)]);
  [...ids].sort().forEach(id => {
    const m = id.match(/^(.*)-([^-]+)$/);
    rows.push([id, m ? m[1] : '', m ? m[2] : '', owned[id] ? '1' : '0', customImg[id] || '']);
  });
  const csv = rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  download('﻿' + csv, `pokecard_backup_${ts()}.csv`, 'text/csv;charset=utf-8');
  toast('CSVを書き出しました');
}

// 簡易CSVパーサ（引用符・改行・カンマ対応）
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else {
      if (c === '"') q = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += c;
    }
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.length && r.some(x => x !== ''));
}

function applyImport(incoming, images, label) {
  if (!incoming || typeof incoming !== 'object') { alert('読み込めるデータではありませんでした。'); return; }
  const merge = confirm(`${label}を読み込みます。\n[OK]=いまのデータに統合（追加）\n[キャンセル]=丸ごと上書き`);
  owned = merge ? Object.assign({}, owned, incoming) : incoming;
  if (images && Object.keys(images).length) customImg = merge ? Object.assign({}, customImg, images) : images;
  else if (!merge) customImg = {};
  saveImages();
  pending.clear(); updateSaveBar();
  saveOwned();
  closeData();
  toast(`${label}を読み込みました`);
  rerender();
}

document.getElementById('importFileJson').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      const inc = d.owned || d;
      const map = {};
      Object.keys(inc).forEach(k => { if (inc[k]) map[k] = 1; });
      applyImport(map, d.images || {}, 'JSON');
    } catch { alert('読み込めるJSONではありませんでした。'); }
  };
  rd.readAsText(f); e.target.value = '';
});

document.getElementById('importFileCsv').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const rows = parseCSV(rd.result);
      if (!rows.length) throw 0;
      // ヘッダ行から card_id / owned 列を特定（無ければ1列目をID扱い）
      const head = rows[0].map(h => h.trim().toLowerCase());
      const hasHeader = head.includes('card_id');
      let idCol = head.indexOf('card_id'), ownCol = head.indexOf('owned'), imgCol = head.indexOf('image_url');
      let start = hasHeader ? 1 : 0;
      if (idCol === -1) idCol = 0;
      const map = {}, imgs = {};
      for (let i = start; i < rows.length; i++) {
        const id = (rows[i][idCol] || '').trim();
        if (!id || id.toLowerCase() === 'card_id') continue;
        const ownVal = ownCol >= 0 ? String(rows[i][ownCol]).trim().toLowerCase() : '1';
        const isOwn = ownCol < 0 || ['1','true','yes','o','y','所有','◯','○','あり'].includes(ownVal);
        if (isOwn) map[id] = 1;
        if (imgCol >= 0) { const u = (rows[i][imgCol] || '').trim(); if (u) imgs[id] = u; }
      }
      applyImport(map, imgs, 'CSV');
    } catch { alert('読み込めるCSVではありませんでした。'); }
  };
  rd.readAsText(f); e.target.value = '';
});

function rerender() {
  const h = location.hash.slice(1);
  if (h && setDetailCache[h]) renderSet(setDetailCache[h]);
  else if (h) goSet(h);
  else goSets();
}

// ---- utils ----
function esc(s) { return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 1800);
}

// ---- 戻る/進む（ブラウザ履歴）対応：hash変化で画面を復元 ----
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if (h === renderedHash) return; // 自分で設定した変化は無視
  if (h) goSet(h); else goSets();
});

// ---- ログイン/新規登録画面 ----
let loginMode = 'login';
function renderLoginScreen() {
  const card = document.getElementById('loginCard');
  if (loginMode === 'signup') {
    card.innerHTML = `
      <div class="logo"><span class="dot"></span>ポケカ コレクション</div>
      <div class="lead"><b style="font-size:15px;color:var(--text)">新規登録</b><br>IDとパスワードを決めてください。<br>以降どの端末からでもこのID・パスワードでログインできます。</div>
      <input id="suEmail" placeholder="ID（例: rinta@poke.jp）" autocomplete="username" autocapitalize="none">
      <input id="suPw" type="password" placeholder="パスワード（6文字以上）" autocomplete="new-password">
      <div class="row"><button class="btn primary" id="suBtn">登録する</button></div>
      <button class="skip" id="toLogin">← ログイン画面にもどる</button>`;
    document.getElementById('suBtn').onclick = () => authFlow(true, val('suEmail'), val('suPw'));
    document.getElementById('toLogin').onclick = () => { loginMode = 'login'; renderLoginScreen(); };
  } else {
    card.innerHTML = `
      <div class="logo"><span class="dot"></span>ポケカ コレクション</div>
      <div class="lead">ID・パスワードでログインすると、データがクラウドに保存され<br><b>PC・スマホで同じコレクション</b>を使えます。</div>
      <input id="loginEmail" placeholder="ID（例: rinta@poke.jp）" autocomplete="username" autocapitalize="none">
      <input id="loginPw" type="password" placeholder="パスワード" autocomplete="current-password">
      <div class="row"><button class="btn primary" id="liBtn">ログイン</button></div>
      <button class="skip" id="toSignup" style="margin-top:18px;color:var(--accent);font-size:13px">はじめての方 → 新規登録はこちら</button>
      <br><button class="skip" id="loginSkip">アカウントを使わず、この端末だけで使う</button>`;
    document.getElementById('liBtn').onclick = () => authFlow(false, val('loginEmail'), val('loginPw'));
    document.getElementById('toSignup').onclick = () => { loginMode = 'signup'; renderLoginScreen(); };
    document.getElementById('loginSkip').onclick = () => {
      try { localStorage.setItem('pokecard_localonly', '1'); } catch {}
      hideLoginScreen();
      toast('この端末だけで使います（後でデータ管理からログインできます）');
    };
  }
}
function showLoginScreen() { loginMode = 'login'; renderLoginScreen(); document.getElementById('loginScreen').classList.add('on'); }
function hideLoginScreen() { document.getElementById('loginScreen').classList.remove('on'); }

// ---- boot ----
refreshTotal();
setCloudStatus();
if (location.hash && location.hash.length > 1) goSet(location.hash.slice(1));
else goSets();
fetchMasterImages(); // 共有画像マスタを取得（未ログインでも表示に反映）
fetchSetPatterns();  // セット画像パターンを取得
if (loggedIn()) {
  cloudInitialSync(); // ログイン済みなら起動時にクラウドから取得
} else if (cloudConfigured() && localStorage.getItem('pokecard_localonly') !== '1') {
  showLoginScreen(); // 未ログイン かつ「ローカルのみ」未選択 → ログイン画面
}
